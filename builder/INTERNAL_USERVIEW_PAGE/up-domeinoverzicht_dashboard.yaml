elements:
- className: menu-component
  properties:
    userviewCacheDuration: '20'
    userviewCacheScope: ''
    keyName: ''
    id: domeinoverzicht_dashboard
    label: Domeinoverzicht
    enableOffline: ''
    iconIncluded: false
    customId: ''
    content: |-
      <h1><i class="fas fa-globe"></i> Domeinoverzicht</h1>
      <p>Bekijk de registratie en volledigheid van diensten, applicaties en websites binnen jouw domein.</p>
      <div style="margin-bottom: 24px;"><strong>Domein:</strong> <span style="color: #003a70;">#currentUser.domain#</span> <span style="font-size: 12px; color: #6b7280;">(voorbeeld selectielijst als meerdere domeinen toegestaan)</span></div>
      <!-- Hier komen de secties en tegels -->
- elements:
  - elements:
    - className: org.joget.plugin.enterprise.InformationTileComponent
      properties:
        template: |-
          <!--{sampleWidth: '250px'}-->
          <div class="card flex-row row align-items-center align-items-stretch border-0 ms-0 me-0" style="background-color:{{color||#348fe2}}; color:#fff;">
              <div class="stats-icon col-4 py-3 d-flex align-items-center justify-content-center rounded-start" style="background:rgba(0,0,0,.4); font-size: 48px; color: #fff;">
                  {{icon||<i class="fas fa-globe"></i>}}
              </div>
              <div class="stats-info py-3 col-8">
                  <p style="font-size: 24px; font-weight: 600; margin-bottom: 10px;">{{value||3,291,922}}</p>
                  <h4 style="font-size: 12px;margin: 5px 0;">{{title||TOTAL VISITORS}}</h4>
              </div>
          </div>
        color: '#1677FF'
        icon: <i class='fas fa-cubes'></i>
        id: tile_diensten_totaal
        title: Totaal diensten
        value: 123 (voorbeeld)
    - className: org.joget.apps.userview.lib.component.HeadingComponent
      properties:
        textContent: Diensten
        id: heading_diensten
        tagName: h2
    className: org.joget.apps.userview.lib.component.ColumnComponent
    properties: {
      }
  className: org.joget.apps.userview.lib.component.ColumnsComponent
  properties:
    attr-data-events-listening: [
      ]
    gutter: 5px
    columns:
    - style-max-width: ''
    css-mobile-stack-columns: 'true'
    id: a6c795b7-ab23-43ae-9f70-aa0034ebcf0f
    customId: ''
